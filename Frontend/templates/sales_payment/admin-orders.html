{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - ElectroMart Order Management</title>
    <!-- CSS imports -->
    <link rel="stylesheet" href="{% static 'sales_payment/css/variables.css' %}">
    <link rel="stylesheet" href="{% static 'sales_payment/css/shared-components.css' %}">
    <link rel="stylesheet" href="{% static 'sales_payment/css/layout.css' %}">
    <style>
        .filter-search-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: var(--space-md);
            margin-bottom: var(--space-lg);
        }

        .admin-filter-tabs {
            display: flex;
            gap: var(--space-2xs);
            overflow-x: auto;
        }

        .admin-filter-tab {
            padding: var(--space-xs) var(--space-sm);
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .admin-filter-tab.active, .admin-filter-tab:hover {
            color: var(--color-primary);
            background-color: var(--color-primary-light);
            border-color: var(--color-primary);
        }

        .admin-search-box {
            position: relative;
            max-width: 280px;
            width: 100%;
        }

        .admin-search-box input {
            padding-left: 2rem;
        }

        .admin-search-box::before {
            content: "ðŸ”";
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.8rem;
            color: var(--text-muted);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="admin-wrapper">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="admin-logo-area">
                <a href="/" class="logo">EM <span>ElectroMart</span></a>
            </div>
            <ul class="admin-menu">
                <li class="admin-menu-item"><a href="/admin-dashboard/">Dashboard</a></li>
                <li class="admin-menu-item"><a href="/admin-orders/" class="active">Order Management</a></li>
                <li class="admin-menu-item"><a href="/admin-promotions/">Promotion Management</a></li>
            </ul>
            <div class="admin-sidebar-footer">
                <a href="/" class="btn btn-secondary btn-sm btn-block" style="justify-content:center;">Shop Front</a>
                <button class="btn btn-secondary btn-sm btn-block" onclick="seedDemoData()" style="justify-content:center; margin-top: var(--space-xs); background-color: var(--color-primary-light); color: var(--color-primary); border-color: var(--color-primary-light); font-weight: 700;">Seed Demo Data</button>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="admin-main">
            <!-- Navbar -->
            <nav class="admin-navbar">
                <div style="display:flex; align-items:center; gap:var(--space-md);">
                    <button class="admin-toggle-btn">&#9776;</button>
                    <h2 class="admin-page-title">Order Management</h2>
                </div>
                <div class="admin-navbar-actions">
                    <div style="display:flex; align-items:center; gap:var(--space-xs);">
                        <div style="text-align:right;">
                            <div style="font-weight:600; font-size:0.85rem;">Admin User</div>
                            <div style="font-size:0.75rem; color:var(--text-secondary);">Sales Module</div>
                        </div>
                        <div style="width:36px; height:36px; border-radius:50%; background-color:var(--color-primary); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.9rem;">
                            AD
                        </div>
                    </div>
                </div>
            </nav>

            <!-- Content Body -->
            <main class="admin-content">
                <div class="card" style="padding: var(--space-lg); background-color: var(--bg-secondary);">
                    <!-- Filter and Search -->
                    <div class="filter-search-container">
                        <div class="admin-filter-tabs">
                            <button class="admin-filter-tab active" data-status="all">All</button>
                            <button class="admin-filter-tab" data-status="unpaid">Unpaid</button>
                            <button class="admin-filter-tab" data-status="pending">Pending</button>
                            <button class="admin-filter-tab" data-status="confirmed">Confirmed</button>
                            <button class="admin-filter-tab" data-status="shipping">Shipping</button>
                            <button class="admin-filter-tab" data-status="completed">Completed</button>
                            <button class="admin-filter-tab" data-status="cancelled">Cancelled</button>
                        </div>
                        <div class="admin-search-box">
                            <input type="text" id="adminOrderSearch" class="form-control" placeholder="Search by order ID, name...">
                        </div>
                    </div>

                    <!-- Orders Table -->
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Order ID</th>
                                    <th>Customer & Phone</th>
                                    <th>Date</th>
                                    <th>Total Amount</th>
                                    <th>Status</th>
                                    <th>Payment</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="adminOrdersTableBody">
                                <!-- Dynamically loaded from admin-orders.js?v=3 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- MODAL 1: VIEW DETAIL MODAL -->
    <div class="modal" id="adminDetailModal">
        <div class="modal-backdrop"></div>
        <div class="modal-content modal-content-lg" style="background-color: var(--bg-secondary);">
            <div class="modal-header">
                <h3 class="modal-title">Order Details</h3>
                <button class="modal-close" type="button">&times;</button>
            </div>
            <div class="modal-body" id="adminDetailModalBody">
                <!-- Injected dynamically by js -->
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" type="button" onclick="closeModal('adminDetailModal')">Close</button>
            </div>
        </div>
    </div>

    <!-- MODAL 2: EDIT STATUS MODAL -->
    <div class="modal" id="adminStatusModal">
        <div class="modal-backdrop"></div>
        <div class="modal-content" style="max-width: 450px; background-color: var(--bg-secondary);">
            <div class="modal-header">
                <h3 class="modal-title">Update Order Status</h3>
                <button class="modal-close" type="button">&times;</button>
            </div>
            <div class="modal-body" id="adminStatusModalBody">
                <!-- Injected dynamically by js -->
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" type="button" onclick="closeModal('adminStatusModal')">Cancel</button>
                <button class="btn btn-primary" type="button" onclick="saveOrderStatusAdmin()">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- JS Scripts -->
    <script src="{% static 'sales_payment/js/shared.js' %}?v=3"></script>
    <script src="{% static 'sales_payment/js/admin-orders.js' %}?v=3"></script>
</body>
</html>
