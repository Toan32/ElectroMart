<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="powerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c6ff" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="12" fill="url(#powerGrad)" />
  <!-- Power box -->
  <rect x="40" y="50" width="120" height="90" rx="8" fill="#1a202c" stroke="#4a5568" stroke-width="4" />
  <!-- Terminals -->
  <circle cx="65" cy="115" r="8" fill="#e53e3e" />
  <circle cx="100" cy="115" r="8" fill="#2d3748" />
  <circle cx="135" cy="115" r="8" fill="#3182ce" />
  <text x="65" y="132" fill="#a0aec0" font-family="sans-serif" font-size="8" text-anchor="middle">V+</text>
  <text x="100" y="132" fill="#a0aec0" font-family="sans-serif" font-size="8" text-anchor="middle">COM</text>
  <text x="135" y="132" fill="#a0aec0" font-family="sans-serif" font-size="8" text-anchor="middle">V-</text>
  
  <!-- Lightning bolt -->
  <path d="M105 60 L85 85 L100 85 L95 105 L115 80 L100 80 Z" fill="#ecc94b" />
  
  <text x="100" y="38" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">POWER MODULE</text>
</svg>
