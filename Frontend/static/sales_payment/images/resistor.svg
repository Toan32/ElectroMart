<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="resistorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f12711" />
      <stop offset="100%" stop-color="#f5af19" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="12" fill="url(#resistorGrad)" />
  <!-- Lead wires -->
  <line x1="20" y1="100" x2="180" y2="100" stroke="#cbd5e0" stroke-width="8" stroke-linecap="round" />
  <!-- Resistor Body -->
  <rect x="50" y="75" width="100" height="50" rx="10" fill="#e2e8f0" stroke="#cbd5e0" stroke-width="4" />
  <!-- Color Bands -->
  <rect x="70" y="75" width="8" height="50" fill="#b7791f" />
  <rect x="88" y="75" width="8" height="50" fill="#2d3748" />
  <rect x="106" y="75" width="8" height="50" fill="#c53030" />
  <rect x="130" y="75" width="8" height="50" fill="#d69e2e" />
  
  <text x="100" y="160" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">RESISTOR</text>
</svg>
