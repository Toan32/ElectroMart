<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#833ab4" />
      <stop offset="50%" stop-color="#fd1d1d" />
      <stop offset="100%" stop-color="#fcb045" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="12" fill="url(#capGrad)" />
  <!-- Lead wires -->
  <line x1="85" y1="120" x2="85" y2="175" stroke="#cbd5e0" stroke-width="6" stroke-linecap="round" />
  <line x1="115" y1="120" x2="115" y2="160" stroke="#cbd5e0" stroke-width="6" stroke-linecap="round" />
  
  <!-- Capacitor Body -->
  <rect x="65" y="40" width="70" height="90" rx="8" fill="#2d3748" stroke="#4a5568" stroke-width="4" />
  <rect x="65" y="50" width="70" height="20" fill="#4a5568" />
  <!-- Negative stripe -->
  <rect x="115" y="40" width="15" height="90" fill="#cbd5e0" />
  <text x="122.5" y="70" fill="#2d3748" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">-</text>
  <text x="122.5" y="95" fill="#2d3748" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">-</text>
  <text x="122.5" y="120" fill="#2d3748" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">-</text>
  
  <text x="100" y="24" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">CAPACITOR</text>
</svg>
